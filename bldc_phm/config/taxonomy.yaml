test_templates:
  'pick a test type': {}
  Healthy baseline:
    stage: 1_baseline
    condition: healthy
    severity: none
    orientation: horizontal
    mount: rigid
    load: no_load
    fault_mechanism: none
  'Fault: loose mount':
    stage: 3_fault
    condition: loose_mount
    severity: mild
    fault_mechanism: mount_bolts_loosened
    orientation: horizontal
    mount: loosened
    load: no_load
    notes: Back the mounting bolts off; motor still captive but no longer rigid.
  'Fault: rotor drag':
    stage: 3_fault
    condition: rotor_drag
    severity: mild
    fault_mechanism: shaft_friction_pad
    orientation: horizontal
    mount: rigid
    load: light
    notes: Press the friction pad against the rotating shaft. Steady pressure, not a stall.
  'Fault: overheat':
    stage: 3_fault
    condition: overheat
    severity: mild
    fault_mechanism: heat_gun
    orientation: horizontal
    mount: rigid
    load: no_load
    notes: Heat gun on the casing. Watch MOTOR TEMP; stop well before the 80 degC winding limit.
  'Fault: orientation change':
    stage: 3_fault
    condition: orientation_change
    severity: mild
    fault_mechanism: motor_reoriented
    orientation: vertical_shaft_up
    mount: rigid
    load: no_load
    notes: Rotate the motor. The KX134 gravity vector is what should reveal this.
defaults: {}
