calibration_checks:
- Supply voltage confirmed (PSU display or any DMM)
- Driver current limit set to rated (~1.8 A), not 6 A peak
- Mount secure (bolts torqued / clamp tight)
- Warm-up done (or noted as cold-start)
- Speed stable at target
matrix:
  rows: speed_rpm_nominal
  cols: load
coverage_plan:
  runs_per_cell: 3
  # Reduced plans (2026-07-30, operator): quick tests for the faults whose
  # signature barely changes with rpm. Low/mid/high speed at 2 runs each = 6 runs
  # (~17 min) per category. rotor_drag keeps the full 10x3 grid, its load
  # signature is the speed-dependent one. healthy already recorded at full grid.
  condition_overrides:
    rotor_drag:
      # Spectrum sweep (operator, 2026-07-30): one run per speed across the range,
      # 80 s hold each so ALL FIVE runs fit in 10 minutes total. Drag current is
      # 100s of mA against a ~4 mA floor; 800 frames per point is ample.
      speeds: {300: 1, 900: 1, 1300: 1, 1700: 1, 2100: 1}
      hold_s: 80
    overheat:
      # Exactly ONE run at 2100 (operator, 2026-07-30): the heat-gun signature
      # lives in the NTC channel and barely depends on rpm.
      speeds: {2100: 1}
    orientation_change:
      speeds: [500, 1300, 2100]
      runs_per_cell: 2
    loose_mount:
      # 2100 gets a third run (operator, 2026-07-30), tilt varied per run, so the
      # top speed carries left/right/neutral examples.
      speeds: {500: 2, 1300: 2, 2100: 3}
  speeds:
  - 300
  - 500
  - 700
  - 900
  - 1100
  - 1300
  - 1500
  - 1700
  - 1900
  - 2100
  conditions:
  - healthy
  - loose_mount
  - rotor_drag
  - overheat
  - orientation_change
